<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta http-equiv="content-type" content="text/html; charset=UTF8">
	<title>LPAA</title>
  <base href="/">
	<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
	<meta content="" name="description" />
  <meta content="" name="author" />

  <!--
    Que nadie convierta los números en enlaces por su cuenta.

    Safari del iPhone y la integración de Zoiper en el navegador van leyendo
    el texto de la página, y a todo lo que les parece un teléfono le ponen
    encima un enlace para llamar, con su icono y la bandera del país. En el
    CRM eso estorba: los números se marcan con el botón de llamar, que pasa
    por el softphone del puesto, y el enlace automático se los lleva fuera
    del navegador.
  -->
  <meta name="format-detection" content="telephone=no" />

  <link rel="icon" type="image/x-icon" href="favicon.ico" />
</head>
<body detect-scroll (onScroll)="handleScroll($event)">
  <app-root>
    <!-- BEGIN #loader -->
		<div id="loader" class="app-loader">
			<span class="spinner"></span>
		</div>
		<!-- END #loader -->
  </app-root>
</body>
</html>
