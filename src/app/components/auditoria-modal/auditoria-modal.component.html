<!-- spinner -->
<ng-container *ngIf="(isLoading$ | async)">
  <div class="loader1" role="status" aria-label="Cargando"></div>
  <div class="overlay1" aria-hidden="true"></div>
</ng-container>

<div class="modal-content scrollbar-style">
  <!-- Header -->
  <div class="modal-header bg-light d-flex align-items-center sticky-header">
    <h5 class="modal-title fw-bold">
      <i class="bi bi-clock-history me-2"></i>Historial de Auditoría
    </h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
  </div>

  <!-- Body -->
  <div class="modal-body p-4 d-flex flex-column scrollbar-style">
    <!-- Filtros -->
    <div class="row mb-4 g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label small text-muted mb-1">Tipo de operación</label>
        <select class="form-select form-select-sm shadow-sm" [(ngModel)]="filtro.tipoOperacion">
          <option value="">Todas las operaciones</option>
          <option value="INSERT">Creación</option>
          <option value="UPDATE">Actualización</option>
          <option value="DELETE">Eliminación</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label small text-muted mb-1">Fecha desde</label>
        <input type="date" class="form-control form-control-sm shadow-sm" [(ngModel)]="filtro.fechaDesde">
      </div>
      <div class="col-md-3">
        <label class="form-label small text-muted mb-1">Fecha hasta</label>
        <input type="date" class="form-control form-control-sm shadow-sm" [(ngModel)]="filtro.fechaHasta">
      </div>
      <div class="col-md-3 d-flex gap-2 mb-1">
        <button class="btn btn-sm btn-primary flex-grow-1" (click)="aplicarFiltros()">
          <i class="bi bi-funnel me-1"></i>Filtrar
        </button>
        <button class="btn btn-sm btn-outline-secondary" (click)="limpiarFiltros()">
          <i class="bi bi-eraser me-1"></i>Limpiar
        </button>
      </div>
    </div>

    <!-- AG Grid -->
    <div class="ag-grid-container border rounded-3 shadow-sm">
<ag-grid-angular
  class="ag-theme-alpine"
  [rowData]="auditoriaData"
  [columnDefs]="columnDefs"
  [defaultColDef]="defaultColDef"
  [domLayout]="'autoHeight'"
  [pagination]="false"
  [rowHeight]="120"
  [enableCellTextSelection]="true"
  [ensureDomOrder]="true"
  [headerHeight]="25"
  [rowStyle]="{'font-size': '10px'}"
  (gridReady)="onGridReady($event)"
  style="width: 100%; min-height: 400px;">
</ag-grid-angular>
    </div>

    <!-- Paginación -->
    <div class="pagination-controls d-flex justify-content-between align-items-center mt-2 px-2 flex-wrap">
      <div class="pagination-info small mb-2 mb-sm-0">
        Mostrando {{ (paginaActual-1)*registrosPorPagina + 1 }} - 
        {{ paginaActual * registrosPorPagina > totalRegistros ? totalRegistros : paginaActual * registrosPorPagina }}
        de {{ totalRegistros }} registros
      </div>
      <div class="pagination-buttons">
        <button class="btn btn-sm btn-outline-secondary me-1" (click)="firstPage()" [disabled]="paginaActual === 1">
          <i class="fa fa-angle-double-left"></i>
        </button>
        <button class="btn btn-sm btn-outline-secondary me-1" (click)="prevPage()" [disabled]="paginaActual === 1">
          <i class="fa fa-chevron-left"></i>
        </button>
        <span class="pagination-page-badge small mx-1">Página {{ paginaActual }} de {{ ultimaPagina }}</span>
        <button class="btn btn-sm btn-outline-secondary ms-1" (click)="nextPage()" [disabled]="paginaActual === ultimaPagina">
          <i class="fa fa-chevron-right"></i>
        </button>
        <button class="btn btn-sm btn-outline-secondary ms-1" (click)="lastPage()" [disabled]="paginaActual === ultimaPagina">
          <i class="fa fa-angle-double-right"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <!-- <div class="modal-footer bg-light sticky-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="activeModal.close()">
      <i class="bi bi-x-lg me-1"></i>Cerrar
    </button>
  </div> -->
</div>
