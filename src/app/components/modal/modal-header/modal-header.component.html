<div class="modal-header panel-heading" [ngClass]="[bgClass]">
    <h1 class="modal-title" [ngClass]="[textClass]">{{ title }}</h1>
    <button type="button" class="btn btn-danger btn-sm btn-icon btn-square" aria-label="Close" (click)="handleClose()" >
        <i class="fa fa-times"></i>
    </button>
</div>
