<div class="modal-header panel-heading bg-dark text-white border border-gray-600">
    <h1 class="modal-title text-white">{{ title }}</h1>

    <button type="button"
            class="btn btn-danger btn-sm btn-icon btn-square"
            aria-label="Close"
            (click)="handleClose()">
        <i class="fa fa-times"></i>
    </button>
</div>
