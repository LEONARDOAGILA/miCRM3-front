<div class="col-md">
  <div class="form-floating mb-3 mb-md-0 position-relative">
    <input
      type="tel"
      class="form-control fs-12px"
      [id]="label"
      [formControl]="control"
      [placeholder]="placeholder"
      [attr.maxlength]="maxLength"
      [ngClass]="{
        'is-invalid': control.invalid && (control.touched || control.dirty)
      }"
      (input)="onInputChange($event.target.value)"
      (blur)="onBlur()"
      autocomplete="off"
      inputmode="numeric"
    />
    <label [for]="label" class="d-flex align-items-center fs-13px">{{ label }}</label>

    @if (control?.value && control?.enabled) {
      <button 
        type="button"
        class="btn btn-link position-absolute end-0 top-0 mt-3 me-2 text-secondary"
        style="z-index: 10; text-decoration: none;"
        (click)="control.setValue(''); control.markAsDirty();"
        tabindex="-1">
        <i class="fa fa-times-circle"></i>
      </button>
    }
  </div>

  <div class="input-group with-focus">
    <label class="col-lg-12 col-form-label text-lg-left"></label>
    
    @if (control.invalid && (control.dirty || control.touched)) {
      <small class="text-danger msg-requerido">{{ getErrorMessage() }}</small>
    }
  </div>
</div>
