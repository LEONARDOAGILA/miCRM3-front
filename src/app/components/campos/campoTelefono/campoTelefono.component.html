<!-- Se conserva el envoltorio .col-md: las pantallas colocan este componente
     dentro de sus filas contando con que se comporte como columna. -->
<div class="col-md">
  <div class="campo-telefono">

    <div class="form-floating position-relative">
      <input
        type="tel"
        class="form-control fs-13px h-45px"
        [id]="label"
        [formControl]="control"
        [placeholder]="placeholder"
        [attr.maxlength]="maxLength"
        [ngClass]="{
          'is-invalid': control.invalid && (control.touched || control.dirty)
        }"
        (input)="onInputChange($event.target.value)"
        (blur)="onBlur()"
        autocomplete="off"
        inputmode="numeric"
      />

      <!-- py-0 centra la etiqueta flotante en el campo de 45px -->
      <label [for]="label" class="d-flex align-items-center py-0 fs-13px">{{ label }}</label>

      @if (control?.value && control?.enabled) {
        <button
          type="button"
          class="campo-telefono__limpiar"
          (click)="control.setValue(''); control.markAsDirty();"
          tabindex="-1"
          aria-label="Limpiar el teléfono"
          title="Limpiar">
          <!-- Mismo signo que usa el ng-select de app-combo para limpiar
               (el carácter ×, no un icono), para que todos los campos se
               vean igual. -->
          <span class="campo-telefono__limpiar-x" aria-hidden="true">&times;</span>
        </button>
      }
    </div>

    <!-- Zona de mensajes, igual que en app-campoTexto.
         Antes había aquí un <label class="col-form-label"> vacío que reservaba
         espacio muerto; ahora el hueco lo reserva el CSS (min-height). -->
    <div class="campo-telefono__mensajes">
      @if (control.invalid && (control.dirty || control.touched)) {
        <small class="campo-telefono__error">
          <i class="fa fa-triangle-exclamation fa-fw" aria-hidden="true"></i>
          {{ getErrorMessage() }}
        </small>
      }
    </div>

  </div>
</div>
