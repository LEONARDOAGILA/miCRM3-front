  <div class="form-floating mb-3 mb-md-0">
    <input
      class="form-control fs-15px"
      [type]="type"
      [id]="label"
      [placeholder]="placeholder"
      [formControl]="control"      
      (input)="onInputChange($event.target.value)"
      (blur)="onBlur($event)"
      appSoloNumerosEnteros
      [ngClass]="{
        'is-invalid': control.invalid && (control.touched || control.dirty)
      }"
  />
  
  <!-- 'is-valid': control.valid && (control.touched || control.dirty) -->
    <label [for]="label" class="d-flex align-items-center fs-13px">{{ label }}</label>

  </div>


  <div class="input-group with-focus">
    <label class="col-lg-12 col-form-label text-lg-left"></label>
    <small class="text-danger msg-requerido" *ngIf="control.hasError('required') && (control.dirty || control.touched)">
      Es requerido.
    </small>
    <small class="text-danger msg-requerido" *ngIf="control.hasError('cedulaInvalida') && (control.dirty || control.touched)">
      La Identificación no es válida.
    </small>
    <small class="text-danger msg-requerido" *ngIf="control.hasError('maxlength') && (control.dirty || control.touched)">
      No puede exceder los {{ maxLength }} caracteres.
    </small>
  </div>
