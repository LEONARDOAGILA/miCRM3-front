<!-- El botón de quitar filtros y el campo van SIEMPRE juntos, así que viven
     juntos. La caja de dentro es la que ancla la lupa y la ×, que van
     position:absolute; la de fuera sólo los pone en fila. -->
<div class="campo-busqueda-barra">

  @if (conLimpiarFiltros) {
    <button type="button"
            class="btn btn-sm campo-busqueda__filtros"
            [class.btn-outline-danger]="filtroActivo"
            [class.btn-outline-secondary]="!filtroActivo"
            [title]="tituloLimpiar"
            [attr.aria-label]="tituloLimpiar"
            (click)="alLimpiarFiltros()">
      <!-- La × sólo aparece cuando hay algo que quitar -->
      <i class="fas" [ngClass]="filtroActivo ? 'fa-filter-circle-xmark' : 'fa-filter'"></i>
    </button>
  }

<div class="campo-busqueda__caja" [ngClass]="containerClass">

  <input
    #inputElement
    type="text"
    class="form-control rounded-3 fs-12px campo-busqueda__input"
    [class.campo-busqueda__input--con-x]="limpiable && valor"
    [id]="id"
    [placeholder]="placeholder"
    [value]="valor"
    (input)="onInput($event)"
    (blur)="onBlur($event)"
    (keyup.enter)="onKeyupEnter($event)"
    (keydown.escape)="limpiar()"
  />

  <!-- type="button": sin él, dentro de un formulario la lupa lo enviaba.
       Lleva borde y fondo propios: antes era un icono suelto encima del campo
       y no se veía que se pudiera pulsar. -->
  <button type="button"
          class="btn position-absolute start-0 top-0 shadow-none campo-busqueda__lupa"
          title="Buscar"
          aria-label="Buscar"
          (click)="onButtonClick()">
    <i [class]="iconClass"></i>
  </button>

  <!-- La × sólo cuando hay algo que borrar; misma que app-campoTexto -->
  @if (limpiable && valor) {
    <button type="button"
            class="campo-busqueda__limpiar"
            tabindex="-1"
            aria-label="Limpiar la búsqueda"
            title="Limpiar (Esc)"
            (click)="limpiar()">
      <span class="campo-busqueda__limpiar-x" aria-hidden="true">&times;</span>
    </button>
  }
</div>
</div>
