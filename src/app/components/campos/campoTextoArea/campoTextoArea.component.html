<!-- Se conserva el envoltorio .col-md: las pantallas colocan este componente
     dentro de sus filas contando con que se comporte como columna. -->
<div class="col-md">
  <div class="campo-area">

    <div class="form-floating">
      <!-- La altura iba en un style en línea; ahora la fija el CSS y se puede
           ajustar con el input [filas]. -->
      <textarea
        class="scroll form-control fs-13px campo-area__campo"
        [id]="label"
        [placeholder]="placeholder"
        [formControl]="control"
        [style.height.px]="alto"
        (input)="onInputChange($event.target.value)"
        [appMayusculas]="mayusculas"
        [appSoloLetras]="soloLetras"
        [appTrimEspacios]="trimEspacios"
        [appNoEspacios]="noEspacios"
        [ngClass]="{
          'is-invalid': control.invalid && (control.touched || control.dirty),
          'is-valid': control.valid && (control.touched || control.dirty)
        }"
      ></textarea>

      <!-- En un área de texto la etiqueta se ancla arriba, no centrada -->
      <label [for]="label" class="fs-13px">{{ label }}</label>
    </div>

    <!-- Zona de mensajes, igual que en app-campoTexto.
         El hueco lo reserva el CSS (min-height), así que el formulario no salta
         cuando aparece el error. -->
    <div class="campo-area__mensajes">
      <small class="campo-area__error"
             *ngIf="control.hasError('required') && (control.dirty || control.touched)">
        <i class="fa fa-triangle-exclamation fa-fw" aria-hidden="true"></i>
        Es requerido.
      </small>

      <small class="campo-area__error"
             *ngIf="control.hasError('noEspacios') && (control.dirty || control.touched)">
        <i class="fa fa-triangle-exclamation fa-fw" aria-hidden="true"></i>
        No puede contener solo espacios.
      </small>

      <small class="campo-area__error"
             *ngIf="control.hasError('minlength') && (control.dirty || control.touched)">
        <i class="fa fa-triangle-exclamation fa-fw" aria-hidden="true"></i>
        No puede ser menor a los {{ minLength }} caracteres.
      </small>

      <small class="campo-area__error"
             *ngIf="control.hasError('maxlength') && (control.dirty || control.touched)">
        <i class="fa fa-triangle-exclamation fa-fw" aria-hidden="true"></i>
        No puede exceder los {{ maxLength }} caracteres.
      </small>
    </div>

  </div>
</div>
