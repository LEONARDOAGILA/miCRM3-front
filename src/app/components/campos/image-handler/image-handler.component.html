<!-- image-handler.component.html -->
<div class="position-relative text-center border rounded p-3"
    [class.drag-over]="isDragOver"
    (drop)="onDrop($event)"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)">

  <!-- Botones Pegar y Cerrar -->
  <div *ngIf="!viewMode">
      <div class="close-icon position-absolute top-0 start-0 m-2" (click)="triggerPaste()" title="Pegar imagen (Ctrl+V)">
          <i class="fa-solid fa-paste" style="color: white; font-size: 18px;"></i>            
      </div>
      <div class="close-icon" (click)="clearImage()" *ngIf="imagen_previzualiza" title="Quitar Imagen">
          <i class="fa-solid fa-xmark" style="color: white; font-size: 18px;"></i>            
      </div>
  </div>

  <!-- Imagen Seleccionada -->
  <img *ngIf="imagen_previzualiza" 
      [src]="imagen_previzualiza" 
      class="img-fluid rounded shadow-sm clickable-image" 
      alt="Previsualización de imagen" 
      [style.max-height]="maxHeight"
      style="object-fit: contain;"
      (error)="handleImageError($event)"
      (click)="openFullscreen()">

    <!-- Selector si no hay imagen -->
    <div *ngIf="!imagen_previzualiza" class="card shadow-sm mt-3 border-0">
        <div class="card-body text-center">
        <label for="image-input" class="file-upload-wrapper w-100">
            <i class="bi bi-cloud-upload fs-1 text-primary"></i>
            <h5 class="mt-2">{{placeholderText}}</h5>
            <p class="text-muted small m-0">Arrastra y suelta una imagen aquí</p>
            <p class="text-muted small m-0">o haz clic para buscar en tu dispositivo</p>
            <p class="text-muted small">También puedes usar Ctrl+V para pegar una imagen copiada</p>
            <input type="file" id="image-input" class="d-none" accept="image/*" (change)="processFile($event)">
        </label>
        </div>
    </div>
</div>
<input class="d-none" (paste)="onPaste($event)">
