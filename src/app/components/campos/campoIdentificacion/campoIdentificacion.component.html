<!-- Mismo envoltorio .col-md que app-campoTexto, para poder cambiar uno por
     otro dentro de una fila sin tocar el resto de la pantalla. -->
<div class="col-md">
  <div class="campo-texto campo-identificacion campo-texto--con-icono">

    <div class="form-floating">
      <input
        class="form-control fs-13px h-45px"
        type="text"
        [id]="label"
        [placeholder]="textoEjemplo"
        [formControl]="control"
        [attr.maxlength]="largoMaximo"
        [attr.inputmode]="soloNumeros ? 'numeric' : 'text'"
        [attr.autocomplete]="'off'"
        [attr.data-lpignore]="'true'"
        [attr.data-form-type]="'other'"
        (input)="onInputChange($event.target.value)"
        [ngClass]="{
          'is-invalid': mostrarError,
          'is-valid': mostrarValido
        }"
      />

      <!-- py-0 centra la etiqueta flotante en el campo de 45px -->
      <label [for]="label" class="d-flex align-items-center py-0 fs-13px">{{ label }}</label>

      <button type="button"
              class="campo-texto__limpiar"
              *ngIf="limpiable && control?.value && control?.enabled"
              (click)="limpiar()"
              tabindex="-1"
              [attr.aria-label]="'Limpiar ' + (label || 'el campo')"
              title="Limpiar">
        <span class="campo-texto__limpiar-x" aria-hidden="true">&times;</span>
      </button>

      <!-- El icono cambia con el documento: cédula, empresa o pasaporte -->
      <i class="fa campo-texto__icono"
         *ngIf="!(limpiable && control?.value && control?.enabled)"
         [ngClass]="icono"
         aria-hidden="true"></i>
    </div>

    <!-- Zona de mensajes: el hueco lo reserva el CSS, así que el formulario no
         salta cuando aparece el error. -->
    <div class="campo-texto__mensajes">
      <small class="campo-texto__error"
             *ngIf="control.hasError('required') && (control.dirty || control.touched)">
        <i class="fa fa-triangle-exclamation fa-fw" aria-hidden="true"></i>
        Es requerido.
      </small>

      <!-- Lo que dice el algoritmo del SRI para el documento elegido -->
      <small class="campo-texto__error"
             *ngIf="!control.hasError('required') && fallo && mostrarError">
        <i class="fa fa-triangle-exclamation fa-fw" aria-hidden="true"></i>
        {{ fallo.mensaje }}
      </small>

      <!-- Qué documento se reconoció, cuando el número ya está bien -->
      <small class="campo-identificacion__pista"
             [class.campo-identificacion__pista--aviso]="pistaEsAviso"
             *ngIf="!mostrarError && pista">
        <i class="fa fa-fw" [ngClass]="pistaEsAviso ? 'fa-circle-info' : 'fa-circle-check'" aria-hidden="true"></i>
        {{ pista }}
      </small>
    </div>

  </div>
</div>
