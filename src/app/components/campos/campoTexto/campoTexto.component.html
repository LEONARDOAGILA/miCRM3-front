<!-- Se conserva el envoltorio .col-md: 11 pantallas colocan este componente
     dentro de sus filas contando con que se comporte como columna. -->
<div class="col-md">
  <div class="campo-texto" [class.campo-texto--con-icono]="icono">

    <div class="form-floating">
      <input
        class="form-control fs-13px h-45px"
        [type]="type"
        [id]="label"
        [placeholder]="placeholder"
        [formControl]="control"
        (input)="onInputChange($event.target.value)"
        [appMayusculas]="mayusculas"
        [appSoloLetras]="soloLetras"
        [appTrimEspacios]="trimEspacios"
        [appNoEspacios]="noEspacios"
        [attr.autocomplete]="sinAutocompletado ? 'new-password' : null"
        [attr.data-lpignore]="sinAutocompletado ? 'true' : null"
        [attr.data-form-type]="sinAutocompletado ? 'other' : null"
        [ngClass]="{
          'is-invalid': control.invalid && (control.touched || control.dirty),
          'is-valid': control.valid && (control.touched || control.dirty)
        }"
      />

      <!-- py-0 centra la etiqueta flotante en el campo de 45px -->
      <label [for]="label" class="d-flex align-items-center py-0 fs-13px">{{ label }}</label>

      <!-- Icono decorativo opcional, a la derecha -->
      <i class="fa campo-texto__icono"
         *ngIf="icono"
         [ngClass]="icono"
         aria-hidden="true"></i>
    </div>

    <!-- Zona de mensajes.
         Antes había aquí un <label class="col-form-label"> vacío que reservaba
         espacio muerto, y varias pantallas lo tapaban con ::ng-deep. Ahora el
         hueco lo reserva el CSS (min-height), así que el formulario no salta
         cuando aparece el error. -->
    <div class="campo-texto__mensajes">
      <small class="campo-texto__error"
             *ngIf="control.hasError('required') && (control.dirty || control.touched)">
        <i class="fa fa-triangle-exclamation fa-fw" aria-hidden="true"></i>
        Es requerido.
      </small>

      <small class="campo-texto__error"
             *ngIf="control.hasError('noEspacios') && (control.dirty || control.touched)">
        <i class="fa fa-triangle-exclamation fa-fw" aria-hidden="true"></i>
        No puede contener solo espacios.
      </small>

      <small class="campo-texto__error"
             *ngIf="control.hasError('minlength') && (control.dirty || control.touched)">
        <i class="fa fa-triangle-exclamation fa-fw" aria-hidden="true"></i>
        No puede ser menor a los {{ minLength }} caracteres.
      </small>

      <small class="campo-texto__error"
             *ngIf="control.hasError('maxlength') && (control.dirty || control.touched)">
        <i class="fa fa-triangle-exclamation fa-fw" aria-hidden="true"></i>
        No puede exceder los {{ maxLength }} caracteres.
      </small>
    </div>

  </div>
</div>
