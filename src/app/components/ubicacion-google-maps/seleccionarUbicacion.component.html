<!-- ============================================================
     ELEGIR LA DIRECCIÓN EN EL MAPA (modal)
     Envuelve al mapa y devuelve la dirección desmenuzada con sus fotos.

     La barra de título es la del <panel>, no un modal-header: el mapa ya no
     trae la suya y así no se ven dos, igual que en auditoria-modal. La X de
     cerrar sale del propio panel (ButtonRemoveModal).

     Tampoco hay pie: las dos acciones van en esa misma barra, en la ranura
     [header] del panel. Así el mapa se queda con todo el alto, que es lo que
     se viene a mirar.
     ============================================================ -->

<panel [title]="titulo"
       icono="map-location-dot"
       [noButtonReload]="true"
       [noButtonCollapse]="true"
       [noButtonRemove]="true"
       ButtonRemoveModal="true"
       bodyClass="p-0"
       panelClass="mb-0"
       (panelRemovedModal)="activeModal.dismiss()"
       (panelExpanded)="alExpandirElPanel($event)">

  <!-- Las acciones, en la barra de título. Lo que se va a guardar se dice
       aquí mismo en una línea, para no necesitar un pie. -->
  <div header class="su-acciones">
    <!-- @if (lugar) {
      <span class="su-elegido" [title]="lugar.direccion + ' · ' + coordenadas">
        <i class="fa fa-location-dot"></i>
        <span class="su-elegido__texto">{{ lugar.nombre }}</span>
      </span>
    } @else {
      <span class="su-elegido su-elegido--vacio">
        <i class="fa fa-circle-info"></i>
        <span class="su-elegido__texto">Busca la dirección o pulsa en el mapa</span>
      </span>
    } -->

    <!-- <button type="button" class="btn btn-sm btn-white" (click)="activeModal.dismiss()">
      <i class="fa fa-xmark me-1"></i>Cancelar
    </button> -->
    <button type="button" class="btn btn-sm btn-primary" [disabled]="!lugar || guardando" (click)="usarEstaDireccion()">
      @if (guardando) {
        <i class="fa fa-circle-notch fa-spin me-1"></i>Tomando las fotos…
      } @else {
        <i class="fa fa-check me-1"></i>Usar esta dirección
      }
    </button>
  </div>

  <!-- Sin [altoMapa]: el mapa llena la caja que le deje el modal, y al
       expandir el panel crece con ella. -->
  <div class="su-cuerpo">
    <app-ubicacion-google-maps
      [lugarInicial]="lugarInicial"
      (lugarElegido)="alElegirEnElMapa($event)">
    </app-ubicacion-google-maps>
  </div>
</panel>
