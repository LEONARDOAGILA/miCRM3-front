<!-- ============================================================
     LISTADO DE CARACTERÍSTICAS (la plantilla de cada categoría)

     Estructura, la misma que Marcas:
       1. Miga de pan
       2. <panel> del tema
          2a. Barra: buscador, filtro por categoría, nueva
          2b. Grilla ag-Grid (paginación en servidor)
          2c. Controles de paginación
     ============================================================ -->

<!-- ================= 1. MIGA DE PAN ================= -->
<ol class="breadcrumb lista-breadcrumb">
  <li class="breadcrumb-item"><a (click)="fun_home();">Inventarios</a></li>
  <li class="breadcrumb-item active">Características</li>
</ol>

<!-- ================= 2. PANEL ================= -->
<panel [title]="titulo"
       [noButton]="false"
       [noButtonCollapse]="true"
       (panelReloaded)="allCaracteristicas(paginaActual)"
       (panelExpanded)="ajustarGrid()"
       [closeRoute]="'/inventarios'"
       icono="tag">

  <div class="content-container1 lista-contenido">
    @if (isLoading$ | async) {
      <div class="loader1"></div>
      <div class="overlay1"></div>
    }

    <div class="content2">
      <div class="example-wrapper">

        <!-- ---------- 2a. BARRA DE HERRAMIENTAS ---------- -->
        <div class="row g-2 m-2 align-items-center lista-barra">

          <div class="col pe-1">
            <app-campoBusquedaPaginacion
              [id]="'filter-text-box'"
              [placeholder]="'Buscar por característica o categoría'"
              [iconClass]="'fa fa-search fa-lg'"
              [containerClass]="'w-100'"
              [conLimpiarFiltros]="true"
              [hayFiltro]="hayFiltro"
              [columnasFiltradas]="cuantasColumnasFiltradas"
              (buscar)="onFilterTextBoxChanged($event)"
              (limpiarFiltros)="clearAllFilters()">
            </app-campoBusquedaPaginacion>
          </div>

          <!-- Filtro por categoría: es como se trabaja de verdad, una
               categoría cada vez. Se elige en el mismo árbol que en el
               producto. -->
          <div class="col-auto ps-0">
            <button type="button"
                    class="btn lista-barra__btn"
                    [class.btn-outline-secondary]="!categoriaFiltro"
                    [class.btn-info]="categoriaFiltro"
                    title="Ver sólo las de una categoría"
                    (click)="elegirCategoria()">
              <i class="fa fa-sitemap"></i>
            </button>
          </div>

          @if (categoriaFiltro) {
            <div class="col-auto ps-0">
              <span class="chip chip-info carac-chip" [title]="categoriaFiltroRuta">
                <i class="fa-solid fa-filter"></i>
                {{ categoriaFiltroRuta }}
                <button type="button" class="carac-chip__quitar"
                        title="Quitar el filtro de categoría"
                        (click)="quitarCategoria()">&times;</button>
              </span>
            </div>
          }

          <!-- Nueva característica -->
          <div class="col-auto ps-0">
            <button type="button"
                    class="inactivo btn btn-primary lista-barra__btn"
                    title="Agregar característica"
                    [disabled]="accesoModel?.crear === false"
                    (click)="addCaracteristica()">
              <i class="fa fa-plus"></i>
            </button>
          </div>
        </div>

        <!-- ---------- 2b. GRILLA ----------
             [pagination]="false" porque la paginación la hace el servidor y
             los controles son los de abajo, no los de ag-Grid. -->
        <ag-grid-angular
          class="ag-theme-alpine ag-grid-transparente p-2 lista-grilla"
          [rowData]="caracteristicaModel"
          [columnDefs]="columnDefs"
          [enableCellTextSelection]="true"
          [defaultColDef]="_appAgGridService.defaultColDef"
          [sideBar]="_appAgGridService.sideBar"
          [rowHeight]="_appAgGridService.rowHeight"
          [headerHeight]="_appAgGridService.headerHeight"
          [localeText]="_appAgGridService.localeText"
          [rowSelection]="'single'"
          [pagination]="false"
          [animateRows]="true"
          [navigateToNextCell]="navegarConTeclado"
          [rowClassRules]="rowClassRules"
          [tooltipShowDelay]="400"
          [overlayNoRowsTemplate]="'<span>Esta categoría todavía no tiene características. Créelas con el botón +</span>'"
          (gridReady)="onGridReady($event)"
          (filterChanged)="onFiltroColumna()"
          (cellClicked)="onCellClicked($event)">
        </ag-grid-angular>

        <!-- ---------- 2c. PAGINACIÓN ---------- -->
        <div class="pagination-controls d-flex justify-content-between align-items-center flex-wrap mt-2 px-2">

          <div class="btn-group pagination-buttons" role="group" aria-label="Paginación">
            <button type="button" class="btn btn-sm btn-white" title="Primera página"
                    (click)="firstPage()" [disabled]="paginaActual === 1">
              <i class="fa fa-angle-double-left"></i>
            </button>
            <button type="button" class="btn btn-sm btn-white" title="Página anterior"
                    (click)="prevPage()" [disabled]="paginaActual === 1">
              <i class="fa fa-chevron-left"></i>
            </button>
            <span class="btn btn-sm btn-white pagination-page-badge disabled">
              Página <b>{{ paginaActual }}</b> de <b>{{ ultimaPagina }}</b>
            </span>
            <button type="button" class="btn btn-sm btn-white" title="Página siguiente"
                    (click)="nextPage()" [disabled]="paginaActual === ultimaPagina">
              <i class="fa fa-chevron-right"></i>
            </button>
            <button type="button" class="btn btn-sm btn-white" title="Última página"
                    (click)="lastPage()" [disabled]="paginaActual === ultimaPagina">
              <i class="fa fa-angle-double-right"></i>
            </button>
          </div>

          <div class="pagination-info small text-muted">
            Mostrando <b>{{ desde }}</b> – <b>{{ hasta }}</b> de <b>{{ totalRegistros }}</b> registros
            @if (hayFiltro) { <span class="lista-filtrado">(filtrado)</span> }
          </div>

        </div>

      </div>
    </div>
  </div>

</panel>
