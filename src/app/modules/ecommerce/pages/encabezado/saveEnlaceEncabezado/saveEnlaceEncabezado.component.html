<div class="modal-header bg-gray-800 text-white">
  <h5 class="modal-title">
    <i class="fa-solid fa-link me-2"></i>{{ titulo }}
  </h5>
  <button type="button" class="btn-close btn-close-white" aria-label="Cerrar"
          (click)="activeModal.dismiss()"></button>
</div>

<form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
  <div class="modal-body">
    <div class="row g-3">

      <div class="col-12">
        <app-campoTexto
          [control]="$any(form.controls['texto'])"
          label="TEXTO DEL ENLACE"
          placeholder="NUESTRAS TIENDAS"
          [maxLength]="60"
          [trimEspacios]="true">
        </app-campoTexto>
      </div>

      <div class="col-12">
        <app-campoTexto
          [control]="$any(form.controls['enlace'])"
          label="DIRECCIÓN"
          placeholder="/tiendas"
          [maxLength]="250"
          [trimEspacios]="true">
        </app-campoTexto>

        @if (avisoPestana) {
          <p class="campo-hint mb-0">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> {{ avisoPestana }}
          </p>
        } @else if (!esDesplegable) {
          <p class="campo-hint mb-0">
            <i class="fa-solid fa-circle-info"></i>
            Déjala vacía si este enlace sólo va a abrir un desplegable.
          </p>
        }
      </div>

      <!-- Sólo en los principales: los desplegables se pintan sin icono -->
      @if (!esDesplegable) {
        <div class="col-12">
          <app-combo
            formControlName="icono"
            [items]="iconos"
            [label]="'Icono'"
            bindLabel="name"
            bindValue="id">
          </app-combo>
          <p class="campo-hint mb-0">
            <i class="fa-solid fa-circle-info"></i>
            La lista es cerrada: la tienda los tiene dibujados uno a uno.
          </p>
        </div>
      }

      <div class="col-12">
        <div class="form-check form-switch">
          <app-checkbox class="palanca"
            [control]="ctrlActivo"
            [label]="ctrlActivo.value ? 'Se ve en el menú' : 'Oculto en el menú'"
            [id]="'ck-enlace-activo'">
          </app-checkbox>
        </div>
      </div>

    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-danger" (click)="activeModal.dismiss()">
      <i class="fa fa-times"></i> Salir
    </button>
    <button type="submit" class="btn btn-primary" [disabled]="guardando">
      <i class="fa fa-save"></i> {{ guardando ? 'Guardando…' : 'Guardar' }}
    </button>
  </div>
</form>
