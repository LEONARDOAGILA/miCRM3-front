<!-- ============================================================
     MIS MARCACIONES (modal)

     Filtro de fechas arriba, la rejilla en medio y la paginación
     abajo, como en el resto de listados.
     ============================================================ -->

<app-modal-header title="Mis marcaciones" (onClose)="modal.dismiss()"></app-modal-header>

<div class="modal-body mm-cuerpo">

  <div class="mm-filtros">
    <div class="mm-rangos">
      <button type="button" class="btn btn-sm btn-white" (click)="rango('hoy')">Hoy</button>
      <button type="button" class="btn btn-sm btn-white" (click)="rango('semana')">Semana</button>
      <button type="button" class="btn btn-sm btn-white" (click)="rango('mes')">Mes</button>
    </div>

    <div class="mm-fechas">
      <label>
        <span>Desde</span>
        <input type="date" class="form-control form-control-sm" [(ngModel)]="desde" (change)="cargar(1)">
      </label>
      <label>
        <span>Hasta</span>
        <input type="date" class="form-control form-control-sm" [(ngModel)]="hasta" (change)="cargar(1)">
      </label>
      @if (cargando) { <span class="spinner-border spinner-border-sm mm-cargando"></span> }
    </div>
  </div>

  <ag-grid-angular
    class="ag-theme-alpine ag-grid-transparente lista-grilla mm-grilla"
    [rowData]="marcaciones"
    [columnDefs]="columnDefs"
    [defaultColDef]="_appAgGridService.defaultColDef"
    [rowHeight]="_appAgGridService.rowHeight"
    [headerHeight]="_appAgGridService.headerHeight"
    [localeText]="_appAgGridService.localeText"
    [enableCellTextSelection]="true"
    [sideBar]="false"
    [pagination]="false"
    [animateRows]="true"
    [tooltipShowDelay]="400"
    [overlayNoRowsTemplate]="'<span>No marcó en esas fechas</span>'"
    (gridReady)="onGridReady($event)"
    (cellClicked)="onCellClicked($event)">
  </ag-grid-angular>

  <div class="pagination-controls d-flex justify-content-between align-items-center flex-wrap mt-2">
    <div class="btn-group pagination-buttons" role="group" aria-label="Paginación">
      <button type="button" class="btn btn-sm btn-white" title="Primera página"
              (click)="firstPage()" [disabled]="paginaActual === 1">
        <i class="fa fa-angle-double-left"></i>
      </button>
      <button type="button" class="btn btn-sm btn-white" title="Página anterior"
              (click)="prevPage()" [disabled]="paginaActual === 1">
        <i class="fa fa-chevron-left"></i>
      </button>
      <span class="btn btn-sm btn-white pagination-page-badge disabled">
        Página <b>{{ paginaActual }}</b> de <b>{{ ultimaPagina }}</b>
      </span>
      <button type="button" class="btn btn-sm btn-white" title="Página siguiente"
              (click)="nextPage()" [disabled]="paginaActual === ultimaPagina">
        <i class="fa fa-chevron-right"></i>
      </button>
      <button type="button" class="btn btn-sm btn-white" title="Última página"
              (click)="lastPage()" [disabled]="paginaActual === ultimaPagina">
        <i class="fa fa-angle-double-right"></i>
      </button>
    </div>

    <div class="pagination-info small text-muted">
      Mostrando <b>{{ desdeRegistro }}</b> – <b>{{ hastaRegistro }}</b> de <b>{{ totalRegistros }}</b>
    </div>
  </div>
</div>

<div class="modal-footer pie-modal">
  <button type="button" class="btn btn-danger pie-modal__boton" (click)="modal.dismiss()">
    <i class="fa fa-times fa-fw me-1"></i><span>Cerrar</span>
  </button>
</div>
