<!-- ============================================================
     LISTADO DE NOTIFICACIONES
       1. Miga de pan
       2. <panel>
          2a. Barra: limpiar, buscador, tipo, destinatarios, nueva, auditoría
          2b. Grilla (paginación en servidor)
          2c. Paginación
     ============================================================ -->

<ol class="breadcrumb lista-breadcrumb">
  <li class="breadcrumb-item"><a (click)="fun_home();">Configuración</a></li>
  <li class="breadcrumb-item active">Notificaciones</li>
</ol>

<panel [title]="titulo"
       [noButton]="false"
       [noButtonCollapse]="true"
       (panelReloaded)="allNotificaciones(paginaActual)"
       (panelExpanded)="ajustarTamanoGrid()"
       [closeRoute]="'/config'"
       icono="usuarios">

  <div class="content-container1 lista-contenido">
    @if (isLoading$ | async) {
      <div class="loader1"></div>
      <div class="overlay1"></div>
    }

    <div class="content2">
      <div class="example-wrapper">

        <!-- ---------- 2a. BARRA ---------- -->
        <div class="row g-2 m-2 align-items-center lista-barra">
          <div class="col-auto pe-1">
            <button type="button" class="btn btn-sm btn-outline-secondary lista-barra__btn" title="Limpiar filtros" (click)="clearAllFilters()">
              <i class="fas fa-filter-circle-xmark"></i>
            </button>
          </div>

          <div class="col position-relative pe-1">
            <app-campoBusquedaPaginacion
              [id]="'filter-text-box'"
              [placeholder]="'Buscar por título o mensaje'"
              [iconClass]="'fa fa-search fa-lg'"
              [containerClass]="'position-relative w-100'"
              (buscar)="onFilterTextBoxChanged($event)">
            </app-campoBusquedaPaginacion>
          </div>

          <div class="col-auto pe-1">
            <select class="form-select form-select-sm noti-filtro" [(ngModel)]="tipo" (change)="cambiarTipo()" title="Filtrar por tipo">
              @for (t of tipos; track t.id) { <option [ngValue]="t.id">{{ t.name }}</option> }
            </select>
          </div>

          <!-- Quién la recibió: hace falta una notificación seleccionada -->
          <div class="col-auto pe-1">
            <button type="button" class="btn btn-info lista-barra__btn"
                    [disabled]="!selectedRow"
                    [title]="selectedRow ? 'Ver quién recibió «' + selectedRow.titulo + '»' : 'Seleccione una notificación para ver sus destinatarios'"
                    (click)="verDestinatarios()">
              <i class="fa fa-users"></i>
            </button>
          </div>

          <div class="col-auto ps-0">
            <button type="button" class="inactivo btn btn-primary lista-barra__btn" title="Enviar una notificación"
                    [disabled]="accesoModel?.crear === false" (click)="addNotificacion()">
              <i class="fa fa-plus"></i>
            </button>
          </div>

          @if (accesoModel?.auditar === true) {
            <div class="col-auto">
              <button type="button" class="btn btn-warning lista-barra__btn position-relative"
                      title="Ver historial de auditoría de la notificación seleccionada"
                      [disabled]="!selectedRow" (click)="auditoria()">
                <i class="fa fa-user-secret"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger lista-barra__badge">
                  <i class="fa fa-search"></i>
                </span>
              </button>
            </div>
          }
        </div>

        <!-- ---------- 2b. GRILLA ---------- -->
        <ag-grid-angular
          class="ag-theme-alpine ag-grid-transparente p-2 lista-grilla"
          [rowData]="notificaciones"
          [columnDefs]="columnDefs"
          [enableCellTextSelection]="true"
          [defaultColDef]="_appAgGridService.defaultColDef"
          [sideBar]="_appAgGridService.sideBar"
          [rowHeight]="_appAgGridService.rowHeight"
          [headerHeight]="_appAgGridService.headerHeight"
          [localeText]="_appAgGridService.localeText"
          [rowSelection]="'single'"
          [pagination]="false"
          [animateRows]="true"
          [overlayNoRowsTemplate]="'<span>No hay notificaciones</span>'"
          [navigateToNextCell]="navegarConTeclado"
          (gridReady)="onGridReady($event)"
          (cellClicked)="onCellClicked($event)">
        </ag-grid-angular>

        <!-- ---------- 2c. PAGINACIÓN ---------- -->
        <div class="pagination-controls d-flex justify-content-between align-items-center flex-wrap mt-2 px-2">
          <div class="btn-group pagination-buttons" role="group" aria-label="Paginación">
            <button type="button" class="btn btn-sm btn-white" title="Primera página" (click)="firstPage()" [disabled]="paginaActual === 1">
              <i class="fa fa-angle-double-left"></i>
            </button>
            <button type="button" class="btn btn-sm btn-white" title="Página anterior" (click)="prevPage()" [disabled]="paginaActual === 1">
              <i class="fa fa-chevron-left"></i>
            </button>
            <span class="btn btn-sm btn-white pagination-page-badge disabled">
              Página <b>{{ paginaActual }}</b> de <b>{{ ultimaPagina }}</b>
            </span>
            <button type="button" class="btn btn-sm btn-white" title="Página siguiente" (click)="nextPage()" [disabled]="paginaActual === ultimaPagina">
              <i class="fa fa-chevron-right"></i>
            </button>
            <button type="button" class="btn btn-sm btn-white" title="Última página" (click)="ultimaPagina2()" [disabled]="paginaActual === ultimaPagina">
              <i class="fa fa-angle-double-right"></i>
            </button>
          </div>

          <div class="pagination-info small text-muted">
            Mostrando <b>{{ desdeRegistro }}</b> – <b>{{ hastaRegistro }}</b> de <b>{{ totalRegistros }}</b> notificaciones
          </div>
        </div>

      </div>
    </div>
  </div>
</panel>
