
<!-- BEGIN breadcrumb -->
<ol class="breadcrumb float-xl-end">
  <li class="breadcrumb-item"><a (click)="fun_home();">Inicio</a></li>
  <li class="breadcrumb-item active">Configuración</li>
</ol>
<!-- END breadcrumb -->

<!-- BEGIN page-header -->
<h1 class="page-header">
  Menu de Configuración 
  <small></small>
</h1>
<!-- END page-header -->

<div style="min-height: 100vh; background: url(/assets/img/cover/cover-scrum-board.png) no-repeat fixed; background-size: 360px; background-position: right bottom;">


<!-- BEGIN row -->
<div class="row">
  <!-- BEGIN col-3 -->
  <div class="col-xl-3 col-md-6" *ngFor="let item of menuItems">
    <div class="widget widget-stats" [style.background]="item.color">
      <div class="stats-icon">
        <i [class]="item.icon"></i>
      </div>
      <div class="stats-info">
        <h4>{{ item.label | uppercase }}</h4>
        <p>{{ item.description || 'Módulo de configuración' }}</p>
      </div>
      <div class="stats-link">
        <a [routerLink]="item.link">
          Acceder <i class="fa fa-arrow-alt-circle-right"></i>
        </a>
      </div>
    </div>
  </div>
  <!-- END col-3 -->
</div>
<!-- END row -->

<!-- BEGIN row -->
<div class="row">
  <!-- BEGIN col-6 -->
  <div class="col-xl-6">
    <!-- BEGIN panel -->
    <div class="panel panel-inverse">
      <div class="panel-heading">
        <h4 class="panel-title">Accesos Directos</h4>
        <div class="panel-heading-btn">
          <a href="javascript:;" class="btn btn-xs btn-icon btn-default" data-toggle="panel-expand"><i class="fa fa-expand"></i></a>
        </div>
      </div>
      <div class="panel-body">
        <div class="row">
          <div class="col-6 col-md-4" *ngFor="let shortcut of shortcuts">
            <a [routerLink]="shortcut.link" class="shortcut-link">
              <div class="shortcut-icon" [style.background]="shortcut.color + '20'" [style.color]="shortcut.color">
                <i [class]="shortcut.icon"></i>
              </div>
              <span>{{ shortcut.label }}</span>
            </a>
          </div>
        </div>
      </div>
    </div>
    <!-- END panel -->
  </div>
  <!-- END col-6 -->

  <!-- BEGIN col-6 -->
  <div class="col-xl-6">
    <!-- BEGIN panel -->
    <div class="panel panel-inverse">
      <div class="panel-heading">
        <h4 class="panel-title">Actividad Reciente</h4>
        <div class="panel-heading-btn">
          <a href="javascript:;" class="btn btn-xs btn-icon btn-default" data-toggle="panel-expand"><i class="fa fa-expand"></i></a>
        </div>
      </div>
      <div class="panel-body p-0">
        <div class="table-responsive">
          <table class="table table-panel align-middle mb-0">
            <tbody>
              <tr *ngFor="let activity of recentActivities">
                <td class="w-10px">
                  <i [class]="activity.icon" [style.color]="activity.color"></i>
                </td>
                <td>
                  <span class="fw-600">{{ activity.title }}</span>
                </td>
                <td class="text-end text-muted">
                  <small>{{ activity.time }}</small>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="panel-footer text-end">
        <a href="javascript:;" class="btn btn-white btn-sm">Ver toda la actividad <i class="fa fa-arrow-right ms-5px"></i></a>
      </div>
    </div>
    <!-- END panel -->
  </div>
  <!-- END col-6 -->
</div>
<!-- END row -->
