<div>
  <!-- BEGIN breadcrumb -->
  <ol class="breadcrumb float-xl-end">
    <li class="breadcrumb-item"><a (click)="fun_home();">Inicio</a></li>
    <li class="breadcrumb-item active">Menu Configuracion</li>
  </ol>
  <!-- END breadcrumb -->
  <!-- BEGIN page-header -->
  <h1 class="page-header">Configuracion <small>Seleccione una opción...</small></h1>
  <!-- END page-header -->
</div>




<div style="min-height: 100vh; background: url(/assets/img/cover/cover-scrum-board.png) no-repeat fixed; background-size: 360px; background-position: right bottom;">


<div class="menu-container">   
    <div class="menu-grid">
        <a *ngFor="let item of menuItems" 
           [routerLink]="item.link" 
           class="menu-button"
           [style.background-color]="item.color">
            <i [class]="item.icon" 
               [style.color]="item.iconColor || '#FFFFFF'"></i>
            <span [style.color]="item.iconColor || '#FFFFFF'">{{ item.label }}</span>
        </a>
    </div>
</div>


</div>
