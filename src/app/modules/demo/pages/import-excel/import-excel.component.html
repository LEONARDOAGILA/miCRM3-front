<!-- INICIO breadcrumb -->
<ol class="breadcrumb" style="display: flex; justify-content: flex-end; width: 100%; margin: 0;">
  <li class="breadcrumb-item"><a (click)="fun_home();">Demo</a></li>
  <li class="breadcrumb-item active">Importar Factura</li>
</ol>
<!-- FIN breadcrumb -->

<!-- INICIO PANEL -->
<panel [title]="title" [noButton]="false" [noButtonCollapse]="true" [noButtonReload]="false" [noButtonReload]="false"
  [noButtonExpand]="false">

  <!--    INICIO BODY    -->
  <div class="content-container1">

    <!--    INICIO SPINNER    -->
    <ng-container *ngIf="(isLoading$ | async)">
      <div class="loader1"></div>
      <div class="overlay1"></div>
    </ng-container>
    <!--    FIN SPINNER    -->

    <!-- Descargar plantilla -->
    <div class="mb-3 text-start">
      <a href="assets/plantilla.xlsx" download="plantilla.xlsx" class="btn btn-success">
        <i class="fa fa-file-excel"></i> Descargar Plantilla
      </a>
    </div>

    <!-- Componente de archivo -->
    <app-file accept=".xlsx,.xls" label="Seleccionar archivo Excel" [maxSize]="10485760"
      (fileSelected)="onExcelSelected($event)" (fileError)="onFileError($event)" (fileRemoved)="onFileRemoved()">
    </app-file>

    <!-- Información del archivo seleccionado -->
    <div *ngIf="excelFile" class="alert alert-success mt-3">
      <strong>Archivo seleccionado:</strong> {{ excelFile.name }}<br>
      <strong>Tamaño:</strong> {{ (excelFile.size / 1024 / 1024).toFixed(2) }} MB
    </div>

    <div class="d-flex justify-content-end mt-2">
      <button type="button" class="btn btn-primary" [disabled]="isdisabled" (click)="saveRecord()">Guardar</button>
    </div>

  </div>

</panel>
<!-- FIN PANEL -->
