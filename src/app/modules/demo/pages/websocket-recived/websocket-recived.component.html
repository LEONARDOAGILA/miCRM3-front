<div class="container mt-4">
  <h3 class="text-center mb-3">Mensajes en tiempo real</h3>

  <div class="card shadow p-3">
    <ul class="list-group">
      <li *ngFor="let msg of mensajes" class="list-group-item">
        📡 {{ msg }}
      </li>
    </ul>

    <div *ngIf="mensajes.length === 0" class="text-center text-muted mt-3">
      Aún no hay mensajes...
    </div>
  </div>
</div>
