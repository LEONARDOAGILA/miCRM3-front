<!-- begin spinner -->
<ng-container *ngIf="(isLoading$ | async)">
  <div class="loader1" role="status" aria-label="Cargando"></div>
  <div class="overlay1" aria-hidden="true"></div>
</ng-container>

<app-modal-header 
    [title]="'🔐    Recuperar Contraseña'" 
    (onClose)="cerrar()">
</app-modal-header>

<div class="modal-body">
  
  <!-- STEP 1: Solicitar usuario -->
  <div *ngIf="step === 1">
    <form [formGroup]="formStep1" class="p-3">
      <div class="text-center mb-4">
        <i class="bi bi-question-circle-fill" style="font-size: 48px; color: #ffc107;"></i>
        <h5 class="mt-2">¿Olvidaste tu contraseña?</h5>
        <p class="text-muted">Ingresa tu nombre de usuario para recuperar tu cuenta</p>
      </div>

      <!-- Usando tu componente app-campoTexto -->
      <div class="mb-3">
        <app-campoTexto 
          [control]="formStep1.controls['login_user']" 
          label="Nombre de Usuario"
          placeholder="Nombre de Usuario" 
          [maxLength]="100" 
          [trimEspacios]="true" 
          [mayusculas]="true">
        </app-campoTexto>
      </div>
    </form>
  </div>

<!-- STEP 2: Verificar código -->
<div *ngIf="step === 2">
  <form [formGroup]="formStep2" class="p-3">
    <div class="text-center mb-4">
      <i class="bi bi-envelope-paper-fill" style="font-size: 48px; color: #28a745;"></i>
      <h5 class="mt-2">Código de Verificación</h5>
      <p class="text-muted">Hemos enviado un código a:<br>
        <strong>{{ userData.email }}</strong>
      </p>
    </div>

    <!-- Campo de código con diseño especial - AHORA 6 DÍGITOS -->
<!-- Campo de código con diseño especial - SOLO NÚMEROS -->
<div class="mb-3">
  <label class="form-label fw-bold">Código de 6 dígitos</label>
  <div class="input-group">
    <span class="input-group-text"><i class="bi bi-key"></i></span>
    <input type="text" 
           class="form-control text-center" 
           formControlName="codigo"
           placeholder="123456"
           maxlength="6"
           (keypress)="soloNumeros($event)"
           style="font-size: 24px; letter-spacing: 5px; font-family: monospace;"
           [class.is-invalid]="formStep2.get('codigo')?.invalid && formStep2.get('codigo')?.touched">
  </div>
  <div class="invalid-feedback" *ngIf="formStep2.get('codigo')?.invalid && formStep2.get('codigo')?.touched">
    Ingrese el código de 6 dígitos
  </div>
  <div class="mt-3 text-center">
    <button type="button" class="btn btn-link btn-sm" (click)="reenviarCodigo()" [disabled]="isdisabled">
      <i class="bi bi-arrow-repeat"></i> Reenviar código
    </button>
  </div>
</div>




  </form>
</div>

  <!-- STEP 3: Cambiar contraseña -->
  <div *ngIf="step === 3">
    <form [formGroup]="formStep3" class="p-3">
      <div class="text-center mb-4">
        <i class="bi bi-key-fill" style="font-size: 48px; color: #007bff;"></i>
        <h5 class="mt-2">Establecer Nueva Contraseña</h5>
        <p class="text-muted">Ingresa tu nueva contraseña</p>
      </div>

      <!-- Nueva contraseña usando app-campoClave -->
      <div class="mb-3">
        <div class="d-flex align-items-start gap-2">
          <div class="flex-grow-1">
            <app-campoClave 
              [control]="formStep3.controls['new_password']"
              label="Nueva Contraseña"
              placeholder="Ingrese nueva contraseña"
              [maxLength]="50"
              [minLength]="8"
              [requiereMayuscula]="true"
              [requiereMinuscula]="true"
              [requiereNumero]="true"
              [requiereEspecial]="true"
              [sinEspacios]="true"
              [trimEspacios]="true"
              [mostrarRequisitos]="true"
              [mostrarBarraFortaleza]="true">
            </app-campoClave>
          </div>

        </div>
      </div>

      <!-- Confirmar nueva contraseña usando app-campoClave -->
      <div class="mb-3">
        <app-campoClave 
          [control]="formStep3.controls['new_password_confirmation']"
          label="Confirmar Nueva Contraseña"
          placeholder="Confirme nueva contraseña"
          [maxLength]="50"
          [minLength]="8"
          [requiereMayuscula]="true"
          [requiereMinuscula]="true"
          [requiereNumero]="true"
          [requiereEspecial]="true"
          [sinEspacios]="true"
          [trimEspacios]="true"
          [mostrarRequisitos]="false"
          [mostrarBarraFortaleza]="false">
        </app-campoClave>
      </div>

      <!-- Mensaje de error de coincidencia -->
      <div class="text-danger small mt-1" *ngIf="formStep3.errors?.['passwordMismatch'] && (formStep3.get('new_password_confirmation')?.touched || formStep3.get('new_password_confirmation')?.dirty)">
        <i class="bi bi-exclamation-triangle"></i> Las contraseñas no coinciden
      </div>
    </form>
  </div>

</div>

<div class="modal-footer">
  
  <div class="save-buttons" *ngIf="!isdisabled">
    <!-- Botón Volver -->
    <button class="btn btn-secondary equal-width-button" *ngIf="step > 1" (click)="volverPasoAnterior()" type="button">
      <i class="bi bi-arrow-left"></i><span class="m-2">Volver</span>
    </button>
    
    <!-- Botón Enviar (Paso 1) -->
    <button class="btn btn-primary equal-width-button" *ngIf="step === 1" (click)="enviarCodigo()" type="button">
      <i class="bi bi-send"></i><span class="m-2">Enviar Código</span>
    </button>
    
    <!-- Botón Verificar (Paso 2) -->
    <button style="margin-left: 7px;" class="btn btn-success equal-width-button" *ngIf="step === 2" (click)="verificarCodigo()" type="button">
      <i class="bi bi-check-circle"></i><span class="m-2">Verificar Código</span>
    </button>
    
    <!-- Botón Guardar (Paso 3) -->
    <button style="margin-left: 7px;" class="btn btn-primary equal-width-button" *ngIf="step === 3" (click)="cambiarContrasena()" type="button">
      <i class="bi bi-save"></i><span class="m-2">Guardar</span>
    </button>
  </div>
</div>
