<!-- breadcrumb -->
<ol class="breadcrumb" style="display: flex; justify-content: flex-end; width: 100%; margin: 0;margin-top: -20px;">
    <li class="breadcrumb-item"><a (click)="fun_home();">Configuración</a></li>
    <li class="breadcrumb-item active">Perfiles</li>
</ol>

<!-- PANEL -->
<panel [title]="titulo"
       [noButton]="false" 
       [noButtonCollapse]="true" 
       [ButtonPrint]="accesoModel.reporte === true ? true : false"
       [ButtonExportExcel]="accesoModel.reporte === true ? true : false"
       [ButtonExportCsv]="accesoModel.reporte === true ? true : false"
       (panelReloaded)="allProfiles()" 
       (panelExpanded)="ajustarTamanoGrid()" 
       (panelPrinted)="printPdf()"  
       (panelExportExceled)="exportExcel()" 
       (panelExportCsved)="exportCsv()"
       [closeRoute]="'/seguridad'"
       >


      <div class="content-container1" style="margin-top: -19px;">
        <ng-container *ngIf="(isLoading$ | async)">
          <div class="loader1"></div>
          <div class="overlay1"></div>
        </ng-container>
          
        <div class="content2">
            
            <!-- <p *ngIf="(isLoading$ | async)">Este contenido está bloqueado mientras se carga.</p>              
            @if(errorMessage){ <p>{{errorMessage}}</p> } -->


            <div class="example-wrapper">
  

              <!-- CAMPO TEXTO DE BUSQUEDA -->
              <div class="row g-2 m-2 align-items-center">
                  <div class="col-auto pe-1">  <!-- pe-0 quita padding derecho -->
                    <button (click)="clearAllFilters()" class="btn btn-sm btn-outline-secondary">
                      <i class="fas fa-filter-circle-xmark" title="Limpiar Filtros"></i>
                    </button>
                  </div>
                  <div class="col position-relative pe-1">  <!-- pe-0 quita padding derecho -->
                    <app-campoBusquedaPaginacion
                      [id]="'filter-text-box'"
                      [placeholder]="'Buscar'"
                      [iconClass]="'fa fa-search fa-lg'"
                      [containerClass]="'position-relative w-100'"
                      (buscar)="onFilterTextBoxChanged($event)">
                    </app-campoBusquedaPaginacion>
                  </div>                  
                  <div class="col-auto ps-0">  <!-- ps-0 quita padding izquierdo -->
                    <button
                      class="inactivo btn btn-primary d-flex align-items-center justify-content-center square-btn rounded-3"
                      title="Agregar Perfil"
                      [disabled]="accesoModel.crear === false"
                      (click)="addProfile()">
                      <i class="fa fa-plus"></i>
                    </button>
                  </div>

                  <div class="col-auto" *ngIf="accesoModel.auditar === true">
                    <button
                      class="btn btn-warning d-flex align-items-center justify-content-center square-btn rounded-3 position-relative"
                      title="Ver historial de auditoría del registro seleccionado"
                      [disabled]="!selectedRow"
                      (click)="auditoria()">
                      <i class="fa fa-user-secret"></i>
                      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 8px;">
                        <i class="fa fa-search"></i>
                      </span>
                    </button>
                 </div>            

              </div>             
              
              <!-- INICIO DE AG-GRID -->
              <ag-grid-angular 
              [rowData]="perfilModel" 
              [columnDefs]="columnDefs"
              [defaultColDef]="_appAgGridService.defaultColDef" 
              [sideBar]="_appAgGridService.sideBar" 
              [rowHeight]="_appAgGridService.rowHeight" 
              [headerHeight]="_appAgGridService.headerHeight"
              [localeText]="_appAgGridService.localeText"
              [rowSelection]="'single'"
              [pagination]="false"
              [animateRows]="true" 
              class="ag-theme-alpine ag-grid-transparente p-2 ag-grid-responsive"
              style="height: 360.4px; --ag-line-height: 30px;margin-top: -10px;"
              (gridReady)="onGridReady($event)" 
              (cellClicked)="onCellClicked($event)"                 
              ></ag-grid-angular>

        <!-- INICIO CONTROLES DE PAGINACIÓN PERSONALIZADOS -->
        <div class="pagination-controls d-flex justify-content-between align-items-center mt-2 px-2 flex-wrap">
          <div class="pagination-buttons">
            <button class="btn btn-sm btn-outline-secondary me-1" (click)="firstPage()" [disabled]="paginaActual === 1">
              <i class="fa fa-angle-double-left"></i>
            </button>
            <button class="btn btn-sm btn-outline-secondary me-1" (click)="prevPage()" [disabled]="paginaActual === 1">
              <i class="fa fa-chevron-left"></i>
            </button>
            <span class="pagination-info small mx-1">Página {{ paginaActual }} de {{ ultimaPagina }}</span>
            <button class="btn btn-sm btn-outline-secondary ms-1" (click)="nextPage()" [disabled]="paginaActual === ultimaPagina">
              <i class="fa fa-chevron-right"></i>
            </button>
            <button class="btn btn-sm btn-outline-secondary ms-1" (click)="ultimaPagina2()" [disabled]="paginaActual === ultimaPagina">
              <i class="fa fa-angle-double-right"></i>
            </button>
          </div>
          <div class="pagination-info small mb-2 mb-sm-0">
            Mostrando {{ (paginaActual-1)*registrosPorPagina + 1 }} - 
            {{ paginaActual * registrosPorPagina > totalRegistros ? totalRegistros : paginaActual * registrosPorPagina }}
            de {{ totalRegistros }} registros
          </div>

        </div>
        <!-- FIN CONTROLES DE PAGINACIÓN PERSONALIZADOS -->          
              
              <!-- FIN DE AG-GRID -->

            </div>
    
        </div>
      </div>

      
  
  
  
  
  
  
  </panel>
