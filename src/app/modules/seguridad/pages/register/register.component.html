<div class="row no-gutters text-center align-items-center justify-content-center min-vh-100">
    <div class="col-12 col-md-6 col-lg-5 col-xl-4">
        <h1 class="font-weight-bold">REGISTRO NUEVO USUARIO</h1>
        <!-- <p class="text-dark mb-3">We are Different, We Make You Different.</p> -->
        <form class="mb-3" [formGroup]="loginForm">
            <div class="form-group">
                <label for="name" class="sr-only">Nombres completos</label>
                <input type="name" formControlName="name" class="form-control form-control-md" id="name" placeholder="Ingresar nombres">
            </div>
            <div class="form-group">
                <label for="surname" class="sr-only">Apellidos completos</label>
                <input type="surname" formControlName="surname" class="form-control form-control-md" id="surname" placeholder="Ingresar apellidos">
            </div>
            <div class="form-group">
                <label for="email" class="sr-only">Email Address</label>
                <input type="email" formControlName="email" class="form-control form-control-md" id="email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password" class="sr-only">Password</label>
                <input type="password" formControlName="password" class="form-control form-control-md" id="password" placeholder="Enter your password">
            </div>
            <div class="form-group">
                <label for="passwordConf" class="sr-only">Confirmar Password</label>
                <input type="password" formControlName="password_confirmation" class="form-control form-control-md" id="passwordConf" placeholder="Confirmar password">
            </div>
            <ng-container>
                <p class="text-danger">{{hasErrorText}}</p>
            </ng-container>
            
            <div class="form-group d-flex justify-content-between">
                <div class="custom-control custom-checkbox">
                    <input type="checkbox" class="custom-control-input" checked="" id="checkbox-remember">
                    <label class="custom-control-label text-muted font-size-sm" for="checkbox-remember">Remember me</label>
                </div>
                <a class="font-size-sm" href="./reset-password.html">Reset password</a>
            </div>
            <!-- <button class="btn btn-primary btn-lg btn-block text-uppercase font-weight-semibold" type="submit">Sign in</button> -->
            <button class="btn btn-primary btn-lg btn-block text-uppercase font-weight-semibold" type="submit" 
            (click)="submit()" [disabled]="loginForm.invalid">Sign in</button>
        </form>

        <p>Don't have an account? <a class="font-weight-semibold" href="./signup.html">Sign up</a>.</p>
    </div>
</div>
