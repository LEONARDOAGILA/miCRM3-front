<!-- begin spinner -->
<ng-container *ngIf="(isLoading$ | async)">
  <div class="loader1" role="status" aria-label="Cargando"></div>
  <div class="overlay1" aria-hidden="true"></div>
</ng-container>

<!-- CABECERA -->
<div class="modal-header">
  <h4 class="modal-title">Seleccionar Horario</h4>
  <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
</div>

<!-- CUERPO -->
<div class="modal-body">
  <!-- Barra de búsqueda -->
  <div class="row g-2 mb-3 align-items-center">
    <div class="col">
      <app-campoBusquedaPaginacion
        [id]="'filter-text-box-modal'"
        [placeholder]="'Buscar horario...'"
        [iconClass]="'fa fa-search fa-lg'"
        [containerClass]="'position-relative w-100'"
        (buscar)="onSearch($event)">
      </app-campoBusquedaPaginacion>
    </div>
    <div class="col-auto">
      <button class="btn btn-outline-secondary" (click)="limpiarBusqueda()" title="Limpiar">
        <i class="fa fa-eraser"></i>
      </button>
    </div>
  </div>

  <!-- AG-GRID -->
  <ag-grid-angular
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [defaultColDef]="_appAgGridService.defaultColDef"
    [rowHeight]="35"
    [headerHeight]="35"
    [rowSelection]="'single'"
    style="height: 350px; width: 100%;"    
    class="ag-theme-alpine ag-grid-transparente p-2 ag-grid-responsive"
    (gridReady)="onGridReady($event)"
    (cellClicked)="onCellClicked($event)"
    [enableCellTextSelection]="true"
  ></ag-grid-angular>

  <!-- Controles de paginación -->
  <div class="pagination-controls d-flex justify-content-between align-items-center mt-3 px-2 flex-wrap">
    <div class="pagination-info small mb-2 mb-sm-0">
      Mostrando {{ (paginaActual-1)*registrosPorPagina + 1 }} - 
      {{ paginaActual * registrosPorPagina > totalRegistros ? totalRegistros : paginaActual * registrosPorPagina }}
      de {{ totalRegistros }} registros
    </div>
    <div class="pagination-buttons">
      <button class="btn btn-sm btn-outline-secondary me-1" (click)="firstPage()" [disabled]="paginaActual === 1">
        <i class="fa fa-angle-double-left"></i>
      </button>
      <button class="btn btn-sm btn-outline-secondary me-1" (click)="prevPage()" [disabled]="paginaActual === 1">
        <i class="fa fa-chevron-left"></i>
      </button>
      <span class="pagination-info small mx-1">Página {{ paginaActual }} de {{ ultimaPagina }}</span>
      <button class="btn btn-sm btn-outline-secondary ms-1" (click)="nextPage()" [disabled]="paginaActual === ultimaPagina">
        <i class="fa fa-chevron-right"></i>
      </button>
      <button class="btn btn-sm btn-outline-secondary ms-1" (click)="lastPage()" [disabled]="paginaActual === ultimaPagina">
        <i class="fa fa-angle-double-right"></i>
      </button>
    </div>
  </div>
</div>

<!-- PIE -->
<div class="modal-footer">
  <button class="btn btn-secondary" (click)="modal.dismiss()">Cancelar</button>
</div>
